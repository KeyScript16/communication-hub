<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Crescendo</title>
    <link rel="stylesheet" href="css.css">
</head>
<body>
    <div id="auth-container" style="text-align: center; margin-top: 100px;">
        <h1>Login</h1>
        <input type="email" id="login-email" placeholder="Email" style="display:block; margin: 10px auto; padding: 10px;">
        <input type="password" id="login-pass" placeholder="Password" style="display:block; margin: 10px auto; padding: 10px;">
        <button onclick="login()" style="padding: 10px 20px; background: #4ecca3; border: none; cursor: pointer;">Login</button>
    </div>

    <script>
        async function login() {
            const emailInput = document.getElementById('login-email').value.trim();
            const passInput = document.getElementById('login-pass').value;
            const BASE_URL = 'https://crescendo-chat.onrender.com';

            // Admin Bypass
            if (emailInput === "ALL_COWS_EAT_GRASS" && passInput === "Admin") {
                sessionStorage.setItem("currentUser", JSON.stringify({ email: emailInput, username: "Admin Ben", isAdmin: true }));
                window.location.href = 'dashboard.html';
                return;
            }

            try {
                const response = await fetch(`${BASE_URL}/get-data`);
                const allUsers = await response.json();
                const userFound = allUsers.find(u => u.email.toLowerCase() === emailInput.toLowerCase() && u.password === passInput);

                if (userFound) {
                    sessionStorage.setItem("currentUser", JSON.stringify({ email: userFound.email, username: userFound.username, isAdmin: false }));
                    window.location.href = 'dashboard.html';
                } else {
                    alert("Wrong password or account not found.");
                }
            } catch (err) { alert("Server waking up... try again in 5 seconds."); }
        }
        document.addEventListener("keypress", (e) => { if(e.key === "Enter") login(); });
    </script>
</body>
</html>
