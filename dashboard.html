<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crescendo Dashboard</title>
    <link rel="stylesheet" href="css.css">
    <!-- FIXED: The exact Socket.io link to stop the MIME error -->
    <script src="https://cdn.socket.io"></script>
    <link rel="icon" type="image/png" href="favicon-32x32.png">
</head>
<body>
    <div id="auth-container" style="width: 400px; max-height: 90vh; overflow-y: auto;">
        <h1>Dashboard</h1>
        <p style="margin-bottom: 20px;">Welcome, <span id="user-display" style="color: #4ecca3; font-weight: bold;"></span></p>

        <!-- NEW: ADD FRIEND SECTION -->
        <div style="margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; text-align: left;">
            <h3 style="font-size: 12px; text-transform: uppercase; color: #4ecca3; margin-bottom: 10px;">Add a Friend</h3>
            <div style="display: flex; gap: 8px;">
                <input type="email" id="friend-input" placeholder="Enter email..." style="margin: 0; padding: 10px; font-size: 13px;">
                <button onclick="addFriend()" style="width: 80px; margin: 0; padding: 10px; font-size: 12px;">Add</button>
            </div>
        </div>

        <!-- FRIENDS LIST -->
        <div style="text-align: left; margin-bottom: 25px;">
            <h3 style="font-size: 12px; text-transform: uppercase; color: #4ecca3; margin-bottom: 10px;">Direct Chats</h3>
            <div id="friends-list" style="display: flex; flex-direction: column; gap: 10px;">
                <p style="font-size: 12px; opacity: 0.5;">Loading friends...</p>
            </div>
        </div>

        <!-- CLUBS SECTION -->
        <div style="text-align: left; margin-bottom: 20px;">
            <h3 style="font-size: 12px; text-transform: uppercase; color: #4ecca3; margin-bottom: 10px;">My Clubs</h3>
            <div id="clubs-list" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px;">
                <p style="font-size: 12px; opacity: 0.5;">No clubs yet.</p>
            </div>
            <button onclick="window.location.href='create-club.html'" style="background: rgba(255,255,255,0.1); color: white; border: 1px solid #4ecca3; font-size: 12px; padding: 8px;">+ Create New Club</button>
        </div>

        <button onclick="logout()" style="background: #ff4e4e; color: white; margin-top: 20px;">Logout</button>
    </div>

    <script>
        const BASE_URL = 'https://crescendo-chat.onrender.com';
        const socket = io(BASE_URL);
        const user = JSON.parse(sessionStorage.getItem("currentUser"));
        
        if (!user) window.location.href = 'index.html';
        document.getElementById('user-display').innerText = user.username;

        async function init() {
            try {
                const resData = await fetch(`${BASE_URL}/get-data`);
                const allUsers = await resData.json();
                const me = allUsers.find(u => u.email.toLowerCase() === user.email.toLowerCase());
                const myFriends = me?.friends || [];

                // Render Friends List
                const friendsDiv = document.getElementById('friends-list');
                friendsDiv.innerHTML = "";
                
                const filteredFriends = allUsers.filter(u => myFriends.includes(u.email));
                if(filteredFriends.length === 0) friendsDiv.innerHTML = "<p style='font-size: 12px; opacity: 0.5;'>No friends added yet.</p>";

                filteredFriends.forEach(f => {
                    const div = document.createElement('div');
                    div.style = "display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);";
                    div.innerHTML = `
                        <span style="font-size: 14px;">${f.username}</span>
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <span id="dot-${f.email.replace(/[@.]/g, '')}" style="height: 8px; width: 8px; background: gray; border-radius: 50%;"></span>
                            <button onclick="window.location.href='chat.html?with=${f.email}'" style="width: auto; margin: 0; padding: 5px 12px; font-size: 11px;">Chat</button>
                        </div>
                    `;
                    friendsDiv.appendChild(div);
                });

                // Render Clubs
                const resClubs = await fetch(`${BASE_URL}/get-my-groups?email=${user.email}`);
                const { joined } = await resClubs.json();
                const clubsDiv = document.getElementById('clubs-list');
                clubsDiv.innerHTML = "";
                if(!joined || joined.length === 0) clubsDiv.innerHTML = "<p style='font-size: 12px; opacity: 0.5;'>No clubs found.</p>";
                
                joined.forEach(g => {
                    const div = document.createElement('div');
                    div.style = "display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px; border-left: 3px solid #4ecca3;";
                    div.innerHTML = `<span style="font-size: 14px;">${g.group_name}</span><button onclick="window.location.href='club-chat.html?id=${g.id}'" style="width: auto; margin: 0; padding: 5px 12px; font-size: 11px;">Enter</button>`;
                    clubsDiv.appendChild(div);
                });
            } catch(e) { console.log("Dashboard sync error", e); }
        }

        async function addFriend() {
            const input = document.getElementById('friend-input');
            const targetEmail = input.value.trim().toLowerCase();
            if(!targetEmail || targetEmail === user.email.toLowerCase()) return alert("Enter a valid email!");

            const res = await fetch(`${BASE_URL}/get-data`);
            const allUsers = await res.json();
            const meIdx = allUsers.findIndex(u => u.email.toLowerCase() === user.email.toLowerCase());
            const friendExists = allUsers.some(u => u.email.toLowerCase() === targetEmail);

            if(!friendExists) return alert("User not found!");
            if(!allUsers[meIdx].friends) allUsers[meIdx].friends = [];
            if(allUsers[meIdx].friends.includes(targetEmail)) return alert("Already friends!");

            allUsers[meIdx].friends.push(targetEmail);
            await fetch(`${BASE_URL}/save-data`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(allUsers) });
            alert("Friend added!");
            input.value = "";
            init();
        }

        socket.on('update-online-list', (emails) => {
            document.querySelectorAll('[id^="dot-"]').forEach(d => d.style.background = "gray");
            emails.forEach(e => {
                const dot = document.getElementById(`dot-${e.toLowerCase().replace(/[@.]/g, '')}`);
                if(dot) dot.style.background = "#4ecca3";
            });
        });

        function logout() {
            socket.emit('manual-offline', user.email);
            sessionStorage.clear();
            window.location.href = 'index.html';
        }

        init();
        socket.emit('go-online', { email: user.email, username: user.username });
    </script>
</body>
</html>
