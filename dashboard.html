<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body style="display: flex; flex-direction: column; align-items: center; padding: 20px;">
    <h1>Welcome, <span id="user-display"></span>!</h1>

    <!-- Friends Section (Filtered) -->
    <div style="width: 100%; max-width: 500px; margin-top: 30px;">
        <h2>Direct Chats</h2>
        <div id="friends-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
    </div>

    <!-- Clubs Section -->
    <div style="width: 100%; max-width: 500px; margin-top: 30px;">
        <h2>My Clubs</h2>
        <div id="clubs-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
        <button onclick="window.location.href='create-club.html'" style="margin-top: 15px; width: 100%; padding: 10px; background: #4ecca3; border: none; cursor: pointer;">+ Create New Club</button>
    </div>

    <button onclick="logout()" style="margin-top: 50px; background: #ff4e4e; color: white; border: none; padding: 10px 20px; cursor: pointer;">Logout</button>

    <script>
        const BASE_URL = 'https://crescendo-chat.onrender.com';
        const socket = io(BASE_URL);
        const user = JSON.parse(sessionStorage.getItem("currentUser"));
        
        if (!user) window.location.href = 'index.html';
        document.getElementById('user-display').innerText = user.username;

        async function init() {
            // Fetch User Data for Friends List
            const resData = await fetch(`${BASE_URL}/get-data`);
            const allUsers = await resData.json();
            const me = allUsers.find(u => u.email.toLowerCase() === user.email.toLowerCase());
            const myFriendsEmails = me?.friends || []; // Assumes a 'friends' array in your DB

            const friendsDiv = document.getElementById('friends-list');
            friendsDiv.innerHTML = "";
            allUsers.filter(u => myFriendsEmails.includes(u.email)).forEach(f => {
                const div = document.createElement('div');
                div.className = "friend-item";
                div.style = "background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(78, 204, 163, 0.2);";
                div.innerHTML = `
                    <span>${f.username}</span>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span id="dot-${f.email.replace(/[@.]/g, '')}" class="status-dot" style="height: 10px; width: 10px; background: gray; border-radius: 50%;"></span>
                        <button onclick="window.location.href='chat.html?with=${f.email}'" style="padding: 5px 10px; background: #4ecca3; border: none; cursor: pointer;">Chat</button>
                    </div>
                `;
                friendsDiv.appendChild(div);
            });

            // Fetch Clubs
            const resClubs = await fetch(`${BASE_URL}/get-my-groups?email=${user.email}`);
            const { joined } = await resClubs.json();
            const clubsDiv = document.getElementById('clubs-list');
            clubsDiv.innerHTML = "";
            (joined || []).forEach(g => {
                const div = document.createElement('div');
                div.style = "background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; border: 1px solid #4ecca3;";
                div.innerHTML = `<span>${g.group_name}</span><button onclick="window.location.href='club-chat.html?id=${g.id}'" style="padding: 5px 10px; background: #4ecca3; border: none; cursor: pointer;">Enter</button>`;
                clubsDiv.appendChild(div);
            });
        }

        socket.on('update-online-list', (onlineEmails) => {
            document.querySelectorAll('.status-dot').forEach(dot => dot.style.background = "gray");
            onlineEmails.forEach(e => {
                const dot = document.getElementById(`dot-${e.toLowerCase().replace(/[@.]/g, '')}`);
                if (dot) dot.style.background = "#4ecca3";
            });
        });

        function logout() {
            socket.emit('manual-offline', user.email);
            sessionStorage.clear();
            window.location.href = 'index.html';
        }

        init();
        socket.emit('go-online', { email: user.email, username: user.username });
    </script>
</body>
</html>
