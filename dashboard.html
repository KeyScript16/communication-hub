<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="css.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <h1>Welcome, <span id="user-display"></span>!</h1>
    <div id="friends-list">
        <p>Your Friends:</p>
        <button onclick="startChat('friend@example.com')">Chat with Friend</button>
    </div>
    <button onclick="logout()" style="margin-top: 20px; background: #ff4e4e;">Logout</button>

    <script>
        const BASE_URL = 'https://crescendo-chat.onrender.com';
        const socket = io(BASE_URL);
        const user = JSON.parse(sessionStorage.getItem("currentUser"));
        
        if (!user) window.location.href = 'index.html';
        document.getElementById('user-display').innerText = user.username;

        function startChat(email) {
            window.location.href = `chat.html?with=${email}`;
        }

        function logout() {
            // FIX: Fast offline signal
            socket.emit('manual-offline', user.email);
            sessionStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
