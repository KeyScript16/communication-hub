<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat Session</title>
    <link rel="stylesheet" href="css.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <div id="main-content" style="width: 500px; height: 80vh; display: flex; flex-direction: column;">
        <h1 id="chat-header">Loading...</h1>
        <div id="message-history" style="flex-grow: 1; overflow-y: auto; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px;"></div>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <input type="text" id="chat-input" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>
        <button onclick="goBack()" style="background: none; color: #4ecca3; margin-top: 10px;">Back to Dashboard</button>
    </div>
    <script>
        const BASE_URL = 'https://crescendo-chat.onrender.com';
        const socket = io(BASE_URL);
        const user = JSON.parse(sessionStorage.getItem("currentUser"));
        const params = new URLSearchParams(window.location.search);
        const friendEmail = params.get('with');

        if (!user || !friendEmail) window.location.href = 'index.html';

        async function updateHeader() {
            const response = await fetch(`${BASE_URL}/get-data`);
            const allUsers = await response.json();
            const friend = allUsers.find(u => u.email.toLowerCase() === friendEmail.toLowerCase());
            if (friend) document.getElementById('chat-header').innerText = "Chat with " + friend.username;
        }
        updateHeader();

        let audioCtx;
        function unlockAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        document.addEventListener('click', unlockAudio, { once: true });

        socket.on('new-message', (data) => {
            if (data.fromEmail.toLowerCase() === friendEmail.toLowerCase()) {
                displayMessage(data.fromName, data.message);
                if (audioCtx) { /* Add play bell logic here */ }
            }
        });

        function sendMessage() {
            const input = document.getElementById('chat-input');
            if (input.value) {
                socket.emit('private-message', { to: friendEmail, message: input.value, fromName: user.username, fromEmail: user.email });
                displayMessage("Me", input.value);
                input.value = "";
            }
        }

        function displayMessage(name, text) {
            const history = document.getElementById('message-history');
            const div = document.createElement('div');
            div.innerHTML = `<strong>${name}:</strong> ${text}`;
            history.appendChild(div);
            history.scrollTop = history.scrollHeight;
        }

        function goBack() { window.location.href = 'dashboard.html'; }
    </script>
</body>
</html>
